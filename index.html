<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>EXTINCTION KOMBAT 3D - Jurassic Blood</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex flex-col items-center justify-between bg-zinc-950 text-zinc-100">

    <!-- Les menus (en-tête, sélection, combat, fin de match, grimoire) sont injectés par js/menus/*.js -->
    <!-- MAIN CONTENT CONTAINER -->
    <main id="appMain" class="w-full max-w-6xl flex-1 flex flex-col items-center justify-center px-2 sm:px-4 py-2 relative">
    </main>

    <!-- Registre des combattants & arènes -->
    <script src="js/core/registry.js"></script>
    <!-- Combattants (un fichier par combattant, ordre = ordre du roster) -->
    <script src="js/fighters/trex.js"></script>
    <script src="js/fighters/pachyrhinosaurus.js"></script>
    <script src="js/fighters/ankylosaurus.js"></script>
    <script src="js/fighters/apatosaurus.js"></script>
    <script src="js/fighters/maiasaura.js"></script>
    <script src="js/fighters/terror-bird.js"></script>
    <script src="js/fighters/postosuchus.js"></script>
    <script src="js/fighters/spinosaurus.js"></script>
    <script src="js/fighters/therizinosaurus.js"></script>
    <script src="js/fighters/pulmonoscorpius.js"></script>
    <script src="js/fighters/stegosaurus.js"></script>
    <script src="js/fighters/quetzalcoatlus.js"></script>
    <script src="js/fighters/megatherium.js"></script>
    <!-- Arènes (un fichier par arène) -->
    <script src="js/arenas/volcano.js"></script>
    <script src="js/arenas/boneyard.js"></script>
    <script src="js/arenas/swamp.js"></script>
    <script src="js/arenas/storm.js"></script>
    <!-- Moteur du jeu -->
    <script src="js/core/sound.js"></script>
    <script src="js/core/state.js"></script>
    <script src="js/core/rig.js"></script>
    <script src="js/core/animation.js"></script>
    <script src="js/core/scene.js"></script>
    <script src="js/core/arena.js"></script>
    <script src="js/core/fighter.js"></script>
    <script src="js/core/effects.js"></script>
    <script src="js/core/input.js"></script>
    <script src="js/core/combat.js"></script>
    <script src="js/core/match.js"></script>
    <script src="js/core/ai.js"></script>
    <!-- Menus (un fichier par menu) -->
    <script src="js/menus/header.js"></script>
    <script src="js/menus/select-screen.js"></script>
    <script src="js/menus/battle-screen.js"></script>
    <script src="js/menus/post-match.js"></script>
    <script src="js/menus/moves-modal.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
