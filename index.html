    <script>
    window.__testErrors = [];
    window.addEventListener('error', (e) => {
        const info = e.target && e.target.src ? `Resource error: ${e.target.src}` : (e.message || String(e));
        window.__testErrors.push({ message: info, filename: e.filename || (e.target && e.target.src), lineno: e.lineno });
    }, true);
    window.addEventListener('unhandledrejection', (e) => {
        window.__testErrors.push({ reason: String(e.reason) });
    });
    if (window.location.search.includes('test=1')) {
        const sendLog = (type, data) => {
            try {
                fetch('/api/log', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type, data, ts: performance.now(), href: location.href }) }).catch(() => {});
            } catch (_) {}
        };
        const origErr = console.error;
        console.error = (...args) => {
            origErr.apply(console, args);
            sendLog('error', { consoleError: args.map(String).join(' ') });
        };
        const origWarn = console.warn;
        console.warn = (...args) => {
            origWarn.apply(console, args);
            sendLog('warn', { consoleWarn: args.map(String).join(' ') });
        };
        const origLog = console.log;
        console.log = (...args) => {
            origLog.apply(console, args);
            sendLog('log', { consoleLog: args.map(String).join(' ') });
        };
        window.addEventListener('load', () => {
            setTimeout(() => {
                sendLog('done', {
                    matchState: typeof matchState !== 'undefined' ? matchState : null,
                    uikitDefined: typeof UIKit !== 'undefined',
                    activeRootsCount: typeof UIKit !== 'undefined' ? UIKit.activeRoots.size : 0,
                    domElements: {
                        mainMenu: !!document.getElementById('mainMenu'),
                        selectScreen: !!document.getElementById('selectScreen'),
                        arenaScreen: !!document.getElementById('arenaScreen'),
                        battleScreen: !!document.getElementById('battleScreen'),
                        pauseModal: !!document.getElementById('pauseModal'),
                        settingsModal: !!document.getElementById('settingsModal'),
                        movesModal: !!document.getElementById('movesModal')
                    }
                });
            }, 1000);
        });
    }
    </script>
